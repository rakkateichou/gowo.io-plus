services:
  gowo-plugin-relay:
    build: .
    image: gowo-plugin-relay:1.0
    container_name: gowo-plugin-relay
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - caddy_mesh
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  caddy_mesh:
    external: true
